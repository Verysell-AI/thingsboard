# Serves the SPA for every tenant hostname (<tenant>.localhost) and proxies the API and the
# Socket.IO feed to the api service. The Host header is passed through so the API can resolve
# the tenant from it; $http_host keeps the port, which the console needs to build tenant URLs.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind a TLS proxy (Caddy on a server) keep the scheme it saw; otherwise our own
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name ~^(?<tenant>.+)\.localhost$ localhost _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Docker's embedded DNS. Resolving `api` per request (through the variable below) means a
    # recreated api container with a new address is picked up without restarting nginx, which
    # otherwise keeps the address it resolved at startup and answers 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:4000;

    # API: strip the /api prefix (the API mounts its routes at the root)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
    }

    # Live feed (WebSocket)
    location /socket.io/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Hashed build files under /assets/ can be cached forever. Matched by extension so the app's
    # own /assets/... routes (the register, the fleet report) still reach the SPA fallback.
    location ~ ^/assets/.+\.(js|css|map|svg|png|jpg|jpeg|webp|gif|ico|woff2?|ttf|json|txt)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
